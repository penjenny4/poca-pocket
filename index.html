<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9dce9"><link rel="manifest" href="manifest.webmanifest"><title>POCA Pocket</title><style>body{font:16px -apple-system,sans-serif;background:#fff8fb;color:#342a32;margin:0}header{background:#f9dce9;padding:20px}main{max-width:650px;margin:auto;padding:16px}button{border:0;border-radius:12px;background:#dd70a1;color:white;padding:12px;font:inherit}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #e8cbd9;border-radius:10px;font:inherit}label{display:block;margin:14px 0 5px;font-weight:600}.tabs{display:flex;gap:6px}.tabs button{flex:1}.panel{background:white;border:1px solid #f0dce7;border-radius:14px;padding:14px;margin:10px 0}.card{display:flex;gap:12px;align-items:center}.card img{width:75px;height:95px;object-fit:cover;border-radius:8px}.muted{color:#766674;font-size:13px}.hide{display:none}.warn{color:#a15b00}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.secondary{background:#f2dce7;color:#75455c}a{color:#a42c6b}h1{margin:0 0 8px}</style><header><h1>💗 POCA Pocket</h1><div class="tabs"><button onclick="show('home')">我的收藏</button><button onclick="start()">＋新增</button><button onclick="show('stats')">統計／備份</button></div></header><main><section id="home"><input id="query" placeholder="搜尋成員、團體、專輯、商品連結" oninput="render()"><div id="list"></div></section><section id="edit" class="hide"><h2 id="heading">新增小卡</h2><form id="form"><label>團體／歌手 *</label><input name="group" required><label>成員 *</label><input name="member" required><label>小卡名稱 *</label><input name="name" required><label>商品連結（Mercari／其他平台）</label><input name="productUrl" type="url" placeholder="https://jp.mercari.com/item/m..." oninput="linkCheck()"><div id="linkInfo" class="muted"></div><div id="duplicate" class="warn"></div><label>來源</label><select name="source"><option>專輯</option><option>演唱會</option><option>其他／特典</option></select><label>演唱會／場次</label><input name="concert"><label>專輯</label><input name="album"><label>版本／特典</label><input name="version"><label>購買平台／賣家</label><input name="seller"><label>價格</label><input name="price" type="number" min="0"><label>幣別</label><select name="currency"><option>TWD</option><option>JPY</option><option>KRW</option><option>USD</option></select><label>狀態</label><select name="status"><option>已入手</option><option>已下單</option><option>想購買</option></select><label>購買日期</label><input name="date" type="date"><label>數量</label><input name="quantity" type="number" min="1" value="1"><label>備註</label><textarea name="notes"></textarea><label>正面照片</label><input type="file" id="front" accept="image/*"><label>背面照片</label><input type="file" id="back" accept="image/*"><div id="pics"></div><div class="row"><button type="submit">儲存</button><button type="button" class="secondary" onclick="show('home')">取消</button><button type="button" id="delete" class="secondary" onclick="removeCard()">刪除</button></div></form></section><section id="stats" class="hide"><h2>收藏統計</h2><div id="totals" class="panel"></div><h2>備份資料</h2><p class="muted">本機儲存於 IndexedDB。請定期匯出 JSON 備份，清除網站資料可能造成資料遺失。</p><button onclick="exportData()">匯出 JSON 備份</button> <button onclick="document.getElementById('import').click()" class="secondary">匯入備份</button><input type="file" id="import" accept=".json,application/json" class="hide"></section></main><script>
let db,items=[],id=null,photos={};const $=x=>document.getElementById(x),F=$('form').elements;const fields=['group','member','name','productUrl','source','concert','album','version','seller','price','currency','status','date','quantity','notes'];function url(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.origin+u.pathname.replace(/\/$/,''):''}catch{return ''}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(s){['home','edit','stats'].forEach(x=>$(x).classList.toggle('hide',x!==s));if(s==='stats')stats()}function tx(mode,fn){return new Promise((ok,no)=>{let t=db.transaction('cards',mode);fn(t.objectStore('cards'));t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function load(){items=await new Promise((ok,no)=>{let r=db.transaction('cards').objectStore('cards').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});render()}function start(c){id=c?.id??null;$('form').reset();photos={front:c?.front||'',back:c?.back||''};fields.forEach(k=>{if(c&&c[k]!=null)F[k].value=c[k]});$('heading').textContent=c?'編輯小卡':'新增小卡';$('delete').classList.toggle('hide',!c);$('front').value='';$('back').value='';pics();linkCheck();show('edit')}function linkCheck(){let u=url(F.productUrl.value),m=u.match(/mercari\.com\/item\/(m\d+)/i),dupe=u&&items.find(x=>x.id!==id&&url(x.productUrl)===u);$('linkInfo').innerHTML=(m?'Mercari 商品編號：'+esc(m[1]):u?'已保存商品網址':'')+(u?' · <a target="_blank" rel="noopener" href="'+esc(u)+'">開啟商品頁</a>':'');$('duplicate').textContent=dupe?'⚠️ 這個商品連結已存在於收藏庫，請確認是否重複購買。':''}function pics(){$('pics').innerHTML=['front','back'].filter(k=>photos[k]).map(k=>'<img style="max-width:45%;max-height:160px;margin:5px" src="'+photos[k]+'">').join('')}function compress(file){return new Promise((ok,no)=>{let img=new Image(),src=URL.createObjectURL(file);img.onload=()=>{let s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(src);ok(c.toDataURL('image/jpeg',.75))};img.onerror=no;img.src=src})}['front','back'].forEach(k=>$(k).onchange=async e=>{if(e.target.files[0]){photos[k]=await compress(e.target.files[0]);pics()}});$('form').onsubmit=async e=>{e.preventDefault();let c={id:id||crypto.randomUUID(),...photos};fields.forEach(k=>c[k]=F[k].value);try{await tx('readwrite',s=>s.put(c));await load();show('home')}catch(err){alert('儲存失敗：'+err.message)}};async function removeCard(){if(id&&confirm('確定刪除？')){await tx('readwrite',s=>s.delete(id));await load();show('home')}}function render(){let q=$('query').value.toLowerCase(),found=items.filter(c=>fields.some(k=>String(c[k]||'').toLowerCase().includes(q)));$('list').innerHTML=found.map(c=>'<div class="panel card" data-id="'+esc(c.id)+'">'+(c.front?'<img src="'+c.front+'">':'<div style="width:75px">💗</div>')+'<div><b>'+esc(c.group)+' · '+esc(c.member)+'</b><div>'+esc(c.name)+'</div><div class="muted">'+esc(c.status)+' · '+esc(c.price||'0')+' '+esc(c.currency)+'</div>'+(url(c.productUrl)?'<div class="muted">🔗 商品連結已保存</div>':'')+'</div></div>').join('')||'<p class="muted">還沒有符合的小卡，點上方「＋新增」開始收藏。</p>';document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>start(items.find(c=>c.id===el.dataset.id)))}function stats(){let sums={},statuses={};items.forEach(c=>{statuses[c.status]=(statuses[c.status]||0)+Number(c.quantity||1);if(c.status!=='想購買')sums[c.currency]=(sums[c.currency]||0)+Number(c.price||0)*Number(c.quantity||1)});$('totals').innerHTML='<b>小卡數量</b><p>'+Object.entries(statuses).map(([k,v])=>esc(k)+'：'+v+' 張').join(' / ')+'</p><b>累計花費</b><p>'+Object.entries(sums).map(([k,v])=>v.toLocaleString()+' '+esc(k)).join(' / ')+'</p>'}function exportData(){let b=new Blob([JSON.stringify({app:'POCA Pocket',version:2,cards:items})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='poca-pocket-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('import').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(j.app!=='POCA Pocket'||!Array.isArray(j.cards)||!j.cards.every(c=>c&&typeof c.id==='string'))throw Error('備份格式錯誤');if(!confirm('匯入會取代現有收藏，確定嗎？'))return;await tx('readwrite',s=>{s.clear();j.cards.forEach(c=>s.put(c))});await load();stats();alert('還原完成')}catch(err){alert(err.message)}e.target.value=''};(async()=>{try{db=await new Promise((ok,no)=>{let r=indexedDB.open('poca-pocket-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});await load()}catch(e){alert('本機資料庫無法開啟：'+e.message)}})();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');</script></html>
