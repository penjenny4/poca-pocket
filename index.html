<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8dce9"><link rel="manifest" href="manifest.webmanifest"><title>POCA Pocket</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#302b37;background:#fff8fb}*{box-sizing:border-box}body{margin:0}header{background:#f8dce9;padding:22px 18px 16px}main{max-width:760px;margin:auto;padding:16px 16px 100px}.top{max-width:760px;margin:auto}h1{margin:0;font-size:25px}h2{font-size:19px;margin:16px 0}small,.muted{color:#786c7a}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:11px 15px;background:#e76fa2;color:white;font-weight:600}button.secondary{background:#f4e7ee;color:#75475d}button.danger{background:#ffe4e7;color:#a82b45}.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1}.tabs button:not(.active){background:#ffffffaa;color:#70445b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat,.panel{background:white;border:1px solid #f0dfe8;border-radius:17px;padding:14px}.stat strong{font-size:24px;display:block;margin-top:6px}.bar{display:flex;gap:8px;margin:14px 0}.bar input{flex:1;min-width:0}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.filters button{white-space:nowrap;padding:8px 12px}.filters .off{background:#f4e7ee;color:#70445b}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #f0dfe8;border-radius:16px;overflow:hidden;cursor:pointer}.photo{height:185px;background:#f7e9f0;display:flex;align-items:center;justify-content:center;color:#ad8c9c}.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:11px}.cardbody strong{display:block}.cardbody p{margin:5px 0;font-size:13px;color:#786c7a;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:20px;background:#f8e1ed;padding:4px 9px;font-size:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:14px;font-weight:600}input,select,textarea{width:100%;border:1px solid #e8d7e0;background:white;border-radius:11px;padding:11px;color:#302b37}textarea{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.preview{display:flex;gap:10px}.preview img{width:48%;max-height:190px;object-fit:contain;background:#f8eef4;border-radius:12px}.warning{padding:12px;border-radius:12px;background:#fff0d8;color:#885400;margin:12px 0}.empty{text-align:center;padding:55px 15px;color:#806d7a}.hidden{display:none!important}.footer{font-size:12px;color:#897d89;margin-top:25px;line-height:1.6}.row{display:flex;justify-content:space-between;gap:10px;margin:9px 0}hr{border:0;border-top:1px solid #f0dfe8;margin:18px 0}@media(max-width:360px){.photo{height:150px}.two{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><h1>💗 POCA Pocket</h1><small>把每一張喜歡，都好好收藏。</small><nav class="tabs"><button data-tab="home" class="active">我的收藏</button><button data-tab="edit">＋ 新增小卡</button><button data-tab="stats">收藏統計</button></nav></div></header><main><section id="home"><div class="stats"><div class="stat"><small>已入手</small><strong id="owned">0</strong></div><div class="stat"><small>待收貨</small><strong id="ordered">0</strong></div><div class="stat"><small>想購買</small><strong id="wanted">0</strong></div></div><div class="bar"><input id="search" placeholder="搜尋團體、成員、演唱會、專輯…"><button id="add">＋</button></div><div class="filters" id="filters"></div><div class="cards" id="cards"></div><div class="empty" id="empty">還沒有小卡紀錄，先新增第一張吧 ♡</div></section><section id="edit" class="hidden"><h2 id="formTitle">新增小卡</h2><form id="form"><div class="two"><div class="field"><label>團體／歌手 *</label><input name="group" required placeholder="例如 SEVENTEEN"></div><div class="field"><label>成員 *</label><input name="member" required placeholder="例如 珉奎"></div></div><div class="field"><label>小卡名稱／編號 *</label><input name="name" required placeholder="例如 自拍 A 款"></div><div class="two"><div class="field"><label>來源</label><select name="source"><option>專輯</option><option>演唱會</option><option>其他／特典</option></select></div><div class="field"><label>狀態</label><select name="status"><option>已入手</option><option>已下單</option><option>想購買</option></select></div></div><div class="field"><label>演唱會名稱與場次</label><input name="concert" placeholder="例如 台北場 Day 1"></div><div class="field"><label>專輯名稱</label><input name="album" placeholder="例如 專輯名稱"></div><div class="field"><label>版本／通路</label><input name="version" placeholder="例如 Weverse 特典"></div><div class="two"><div class="field"><label>購買價格</label><input name="price" type="number" min="0" step="0.01" placeholder="0"></div><div class="field"><label>幣別</label><select name="currency"><option>TWD</option><option>JPY</option><option>KRW</option><option>USD</option></select></div></div><div class="two"><div class="field"><label>購買日期</label><input name="date" type="date"></div><div class="field"><label>數量</label><input name="quantity" type="number" min="1" value="1"></div></div><div class="field"><label>購買平台／賣家</label><input name="seller" placeholder="例如 蝦皮、Mercari"></div><div class="field"><label>備註</label><textarea name="notes" placeholder="卡況、交易細節…"></textarea></div><div class="two"><div class="field"><label>小卡正面照片</label><input type="file" id="front" accept="image/*"></div><div class="field"><label>小卡背面照片</label><input type="file" id="back" accept="image/*"></div></div><div class="preview" id="preview"></div><div class="warning hidden" id="duplicate"></div><div class="actions"><button type="submit">儲存小卡</button><button type="button" class="secondary" id="cancel">取消</button><button type="button" class="danger hidden" id="remove">刪除</button></div></form></section><section id="stats" class="hidden"><h2>收藏統計</h2><div class="panel" id="summary"></div><h2>資料備份</h2><div class="panel"><p>資料保存在此裝置的瀏覽器中，不會上傳伺服器。建議定期匯出備份；清除網站資料或換手機可能使紀錄遺失。</p><div class="actions"><button id="export">匯出 JSON 備份</button><button id="importBtn" class="secondary">匯入備份</button></div><input type="file" id="import" accept="application/json,.json" class="hidden"><p class="muted">匯入會取代目前收藏。備份含小卡照片，檔案可能較大。</p></div></section><p class="footer">POCA Pocket · 本機版。使用 IndexedDB 儲存收藏及照片。若瀏覽器處於無痕模式、清除網站資料或儲存空間不足，資料可能遺失。</p></main><script>
let db,items=[],editing=null,photos={front:'',back:''},filter='全部';const $=id=>document.getElementById(id);const fields=['group','member','name','source','status','concert','album','version','price','currency','date','quantity','seller','notes'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('poca-pocket-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function transaction(mode,fn){return new Promise((resolve,reject)=>{let tx=db.transaction('cards',mode),store=tx.objectStore('cards');fn(store);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function load(){items=await new Promise((resolve,reject)=>{let r=db.transaction('cards').objectStore('cards').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});render()}function tab(t){for(let x of ['home','edit','stats'])$(x).classList.toggle('hidden',x!==t);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='stats')renderStats();scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='edit')start();else tab(b.dataset.tab)});$('add').onclick=()=>start();$('cancel').onclick=()=>tab('home');function start(item){editing=item?.id??null;$('form').reset();photos={front:item?.front||'',back:item?.back||''};for(let f of fields)if(item&&item[f]!==undefined)$('form').elements[f].value=item[f];$('formTitle').textContent=item?'編輯小卡':'新增小卡';$('remove').classList.toggle('hidden',!item);$('duplicate').classList.add('hidden');$('front').value='';$('back').value='';preview();tab('edit')}function preview(){$('preview').innerHTML=['front','back'].filter(k=>photos[k]).map(k=>`<img alt="${k==='front'?'正面':'背面'}" src="${photos[k]}">`).join('')}function checkDuplicate(){let f=$('form').elements;let keys=['group','member','name','source','concert','album','version'];let match=items.find(x=>x.id!==editing&&keys.every(k=>String(x[k]||'').trim().toLowerCase()===String(f[k].value||'').trim().toLowerCase()));$('duplicate').classList.toggle('hidden',!match);$('duplicate').textContent=match?'⚠️ 可能重複購買：收藏庫中已有相同團體、成員、名稱與來源版本的小卡。請先確認。':''}for(let f of ['group','member','name','source','concert','album','version'])$('form').elements[f].addEventListener('input',checkDuplicate);function compress(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let ratio=Math.min(1,1000/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.75))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('無法讀取圖片'))};img.src=url})}for(let side of ['front','back'])$(side).onchange=async e=>{try{if(e.target.files[0])photos[side]=await compress(e.target.files[0]);preview()}catch(err){alert(err.message)}};$('form').onsubmit=async e=>{e.preventDefault();let data={id:editing??crypto.randomUUID(),front:photos.front,back:photos.back};for(let f of fields)data[f]=$('form').elements[f].value;try{await transaction('readwrite',s=>s.put(data));await load();tab('home')}catch(err){alert('儲存失敗，可能是裝置空間不足：'+err.message)}};$('remove').onclick=async()=>{if(!editing||!confirm('確定刪除這張小卡？'))return;await transaction('readwrite',s=>s.delete(editing));await load();tab('home')};function render(){for(let [id,status] of [['owned','已入手'],['ordered','已下單'],['wanted','想購買']])$(id).textContent=items.filter(x=>x.status===status).reduce((n,x)=>n+Number(x.quantity||1),0);$('filters').innerHTML=['全部','已入手','已下單','想購買'].map(s=>`<button class="${filter===s?'':'off'}" data-filter="${s}">${s}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});let q=$('search').value.toLowerCase();let shown=items.filter(x=>(filter==='全部'||x.status===filter)&&[x.group,x.member,x.name,x.concert,x.album,x.version,x.seller].join(' ').toLowerCase().includes(q));$('cards').innerHTML=shown.map(x=>`<article class="card" data-id="${esc(x.id)}"><div class="photo">${x.front?`<img src="${x.front}" alt="小卡正面">`:'♡ 尚無照片'}</div><div class="cardbody"><strong>${esc(x.member)}</strong><p>${esc(x.group)} · ${esc(x.name)}</p><p>${esc(x.concert||x.album||x.version||x.source)}</p><p><b>${esc(x.price||'0')} ${esc(x.currency)}</b> · ${esc(x.quantity||1)} 張</p><span class="pill">${esc(x.status)}</span></div></article>`).join('');$('empty').classList.toggle('hidden',shown.length>0);$('empty').textContent=items.length?'沒有符合條件的小卡':'還沒有小卡紀錄，先新增第一張吧 ♡';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>start(items.find(x=>x.id===c.dataset.id)))}$('search').oninput=render;function renderStats(){let bought=items.filter(x=>x.status!=='想購買'),total={};for(let x of bought)total[x.currency]=(total[x.currency]||0)+Number(x.price||0)*Number(x.quantity||1);let groups={};for(let x of items)groups[x.group]=(groups[x.group]||0)+Number(x.quantity||1);$('summary').innerHTML='<b>累計花費（依原幣別）</b>'+Object.entries(total).map(([c,n])=>`<div class="row"><span>${esc(c)}</span><strong>${n.toLocaleString()}</strong></div>`).join('')+'<hr><b>團體收藏數</b>'+Object.entries(groups).map(([g,n])=>`<div class="row"><span>${esc(g)}</span><strong>${n} 張</strong></div>`).join('')+(!items.length?'<p class="muted">還沒有收藏紀錄。</p>':'')}$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'POCA Pocket',version:1,exportedAt:new Date().toISOString(),cards:items})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='poca-pocket-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('import').click();$('import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.app!=='POCA Pocket'||!Array.isArray(data.cards)||!data.cards.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))throw Error('不是有效的 POCA Pocket 備份');if(!confirm('確定匯入？這會取代目前所有收藏，請先匯出現有資料備份。'))return;await transaction('readwrite',s=>{s.clear();data.cards.forEach(x=>s.put(x))});await load();renderStats();alert('匯入成功')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};(async()=>{try{db=await openDB();await load()}catch(err){alert('無法開啟本機資料庫，請使用一般瀏覽模式：'+err.message)}})();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
